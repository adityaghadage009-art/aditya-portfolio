<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two pixels off</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}

svg{width:100%;height:100%;display:block}
text{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900}
</style></head><body>
<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="loupeClip"><polygon id="loupeClipPoly"/></clipPath>
  <clipPath id="eyeClipL"><path id="eyeClipPL"/></clipPath><clipPath id="eyeClipR"><path id="eyeClipPR"/></clipPath>
  <clipPath id="aboveCard"><rect x="0" y="0" width="1000" height="318"/></clipPath>
</defs>

<ellipse cx="500" cy="905" rx="330" ry="22" fill="#e6dccb"/>
<!-- his eyes peeking over the card (clipped so they hide behind its top edge) -->
<g clip-path="url(#aboveCard)"><g id="head">
  <g id="eyeL"><path class="ew" fill="#fff6e6" stroke="#1d1714" stroke-width="7"/><g clip-path="url(#eyeClipL)"><circle class="pu" r="17" fill="#1d1714"/><circle class="gl" r="8" fill="#fff"/></g><path class="lid" fill="#f8f3ea"/><path class="lash" fill="none" stroke="#1d1714" stroke-width="15" stroke-linecap="round"/></g>
  <g id="eyeR"><path class="ew" fill="#fff6e6" stroke="#1d1714" stroke-width="7"/><g clip-path="url(#eyeClipR)"><circle class="pu" r="17" fill="#1d1714"/><circle class="gl" r="8" fill="#fff"/></g><path class="lid" fill="#f8f3ea"/><path class="lash" fill="none" stroke="#1d1714" stroke-width="15" stroke-linecap="round"/></g>
  <path id="browL" fill="#2a1d16"/><path id="browR" fill="#2a1d16"/>
</g></g>
<!-- the UI card -->
<g id="card">
  <polygon id="cardShape" fill="#fff8ec" stroke="#1d1714" stroke-width="10" stroke-linejoin="miter"/>
  <rect id="hdr" x="230" y="352" width="300" height="34" rx="4" fill="#e3a21a"/>
  <g id="avatar"><polygon id="avatarOct" fill="#6f6b34"/><path d="M252 482 A28 28 0 0 1 287 462" fill="none" stroke="#e3a21a" stroke-width="8" stroke-linecap="round"/></g>
  <rect id="l1" x="350" y="452" width="420" height="16" rx="3" fill="#2a211c"/>
  <rect id="l2" x="350" y="486" width="400" height="16" rx="3" fill="#6f6b34"/>
  <rect id="l3" x="350" y="520" width="300" height="16" rx="3" fill="#6f6b34"/>
  <g id="ticksDeco"></g>
  <g id="btn"><polygon id="btnShape" fill="#2a211c"/><rect id="btnLabel" x="-55" y="-6" width="110" height="12" rx="3" fill="#e3a21a"/></g>
</g>
<line id="guide" x1="770" y1="300" x2="770" y2="830" stroke="#e3a21a" stroke-width="5" stroke-dasharray="14 10"/>
<g id="annoy" stroke="#e3a21a" stroke-width="8" stroke-linecap="round"></g>
<g id="loupe">
  <g clip-path="url(#loupeClip)"><rect id="loupeBg" fill="#fff8ec"/><g id="zoom"></g></g>
  <polygon id="loupeRing" fill="none" stroke="#1d1714" stroke-width="14" stroke-linejoin="miter"/>
  <path id="loupeHandle" stroke="#6f6b34" stroke-width="28"/>
</g>
<g id="burst" stroke="#e3a21a" stroke-width="9" stroke-linecap="round"></g>
<g id="cursor"><path d="M0 0 L0 64 L16 49 L28 76 L40 70 L28 44 L50 44 Z" fill="#2a211c" stroke="#fff8ec" stroke-width="5" stroke-linejoin="round"/></g>
</svg>
<script>
{
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const set=(e,a)=>{for(const k in a)e.setAttribute(k,a[k]);};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, out=x=>1-Math.pow(1-x,3), inn=x=>x*x*x;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const spring=(x,f=3.2,d=5.5)=>x<=0?0:1-Math.exp(-d*x)*Math.cos(f*Math.PI*x);
const lerp=(a,b,x)=>a+(b-a)*x;
const oct=(cx,cy,w,h,c)=>{const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2;return [[x0+c,y0],[x1-c,y0],[x1,y0+c],[x1,y1-c],[x1-c,y1],[x0+c,y1],[x0,y1-c],[x0,y0+c]];};
const reg=(cx,cy,r,n=8,rot=Math.PI/8)=>Array.from({length:n},(_,i)=>[cx+r*Math.cos(rot+i*2*Math.PI/n),cy+r*Math.sin(rot+i*2*Math.PI/n)]);
const P=pts=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const LOOP=7.2;
set($('cardShape'),{points:P(oct(500,552,580,460,34))});
set($('avatarOct'),{points:P(reg(275,492,46))});
for(let i=0;i<26;i++){const x=240+i*20;mk('line',{x1:x,y1:756,x2:x,y2:i%5?744:734,stroke:'#1d1714','stroke-width':5},$('ticksDeco'));}
set($('btnShape'),{points:P(oct(0,0,210,64,14))});
const annoyL=[...Array(5)].map((_,i)=>({a:-1.25+i*0.32,l:mk('line',{},$('annoy'))}));
const burstL=[...Array(8)].map((_,i)=>({a:i*Math.PI/4+Math.PI/8,l:mk('line',{},$('burst'))}));
const Z=$('zoom'), zBtn=mk('polygon',{fill:'#2a211c'},Z), zGuide=mk('line',{stroke:'#e3a21a','stroke-width':7,'stroke-dasharray':'22 14'},Z);
const zDim=mk('g',{},Z), zPill=mk('rect',{rx:16,fill:'#e3a21a'},zDim), zTxt=mk('text',{'font-size':34,'text-anchor':'middle',fill:'#1d1714'},zDim);zTxt.textContent='2px';
const zLine=mk('line',{stroke:'#1d1714','stroke-width':5},zDim), zAL=mk('polygon',{fill:'#1d1714'},zDim), zAR=mk('polygon',{fill:'#1d1714'},zDim);
const BTN_FIX=665, BTN_OFF=BTN_FIX+3;
function eye(g,clipP,cx,cy,open,squint,px,py,pr){
  const w=158,h=76*(1-0.3*squint);
  const white=`M${cx-w/2} ${cy+2} C${cx-w/4} ${cy-h*0.6} ${cx+w/4} ${cy-h*0.6} ${cx+w/2} ${cy-2} C${cx+w/4} ${cy+h*0.5} ${cx-w/4} ${cy+h*0.5} ${cx-w/2} ${cy+2}Z`;
  const ly=lerp(cy+h*0.5,cy-h*0.6,open);
  const lid=`M${cx-w/2-10} ${cy-h-12} L${cx+w/2+10} ${cy-h-12} L${cx+w/2+4} ${cy-2} C${cx+w/4} ${ly-2} ${cx-w/4} ${ly-4} ${cx-w/2-4} ${cy+2}Z`;
  const lash=`M${cx-w/2-4} ${cy+2} C${cx-w/4} ${ly-4} ${cx+w/4} ${ly-2} ${cx+w/2+4} ${cy-2}`;
  g.querySelector('.ew').setAttribute('d',white); clipP.setAttribute('d',white);
  g.querySelector('.lid').setAttribute('d',lid); g.querySelector('.lash').setAttribute('d',lash);
  set(g.querySelector('.pu'),{cx:px,cy:py,r:pr}); set(g.querySelector('.gl'),{cx:px+pr*0.35,cy:py-pr*0.4});
}
function render(t){
  t=((t%LOOP)+LOOP)%LOOP;
  // ---- story beats
  const rise=t<5.6?spring(seg(t,0.0,0.9),2.2,5):1-io(seg(t,5.6,6.1));      // peek up / duck down
  const lean=io(seg(t,1.0,1.4))*(1-io(seg(t,2.35,2.7)));                  // leans toward the problem
  const ignore=io(seg(t,2.35,2.7))*(1-back(seg(t,3.35,3.6)));             // nose in the air, eyes shut
  const shock=t>=3.35?back(seg(t,3.35,3.6))*(1-io(seg(t,4.6,5.1))):0;    // eyes pop wide
  const smug=io(seg(t,4.6,5.1));
  // ---- head transform
  const hy=lerp(240,0,rise), hx=lean*22-ignore*14, hr=lean*4-ignore*7+shock*Math.sin((t-3.35)*30)*1.2*(1-seg(t,3.35,3.8));
  const nod=smug*(t<5.6?Math.sin(seg(t,4.9,5.4)*Math.PI)*6:0);
  set($('head'),{transform:`translate(${hx} ${hy+nod-ignore*10}) rotate(${hr} 500 330)`});
  // ---- eyes & brows
  let open=0.76, squint=io(seg(t,1.05,1.35))*(1-io(seg(t,2.35,2.6)));
  open-=0.2*squint;
  if(ignore>0) open=lerp(open,0,ignore);
  const peekL=t>3.0&&t<3.35?Math.sin(seg(t,3.0,3.3)*Math.PI)*0.45:0;   // one eye sneaks a look…
  if(shock>0) open=lerp(open,1.0,shock);
  if(smug>0) open=lerp(open,0.6,smug);
  const blink=(t>0.75&&t<0.9)?1-Math.sin(seg(t,0.75,0.9)*Math.PI):1;
  let px=0,py=8,pr=29;
  px=lerp(-22,0,io(seg(t,0.4,0.9)));
  const look=io(seg(t,1.0,1.35))*(1-io(seg(t,2.35,2.6)));
  px=lerp(px,26,look); py=lerp(py,18,look);
  if(t>=3.0&&t<3.35){px=26;py=18;}
  if(shock>0){pr=lerp(29,18,shock);px=lerp(px,20,shock);py=lerp(py,18,shock);}
  if(t>=3.8&&t<4.6){px=lerp(20,14,io(seg(t,3.9,4.4)));}
  if(smug>0){px=lerp(px,-6,smug);py=lerp(py,6,smug);pr=lerp(pr,29,smug);}
  eye($('eyeL'),$('eyeClipPL'),405,235,cl((open+peekL)*blink),squint,405+px,235+py,pr);
  eye($('eyeR'),$('eyeClipPR'),595,235,cl(open*blink),squint,595+px,235+py,pr);
  const bu=-22*shock, bf=14*squint+5*ignore;   // brows: furrow when suspicious, fly up when shocked
  set($('browL'),{d:`M318 ${150+bu-ignore*3} L488 ${156+bf+bu} L484 ${180+bf+bu} L322 ${176+bu}Z`});
  set($('browR'),{d:`M512 ${156+bf+bu} L682 ${150+bu-ignore*3-smug*10} L678 ${176+bu-smug*10} L516 ${180+bf+bu}Z`});
  // ---- button: 2px off → twitches while ignored → dragged & snaps → slyly slips back at the end
  let bx=BTN_OFF;
  const jit=seg(t,2.75,3.25); if(jit>0&&jit<1) bx+=Math.sin(jit*Math.PI*6)*2.5;
  if(t>=4.05){bx=lerp(BTN_OFF,BTN_FIX-2,io(seg(t,4.05,4.3)));}
  if(t>=4.3){bx=lerp(BTN_FIX-2,BTN_FIX,spring(seg(t,4.3,5.0)));}
  if(t>=6.25){bx=lerp(BTN_FIX,BTN_OFF,io(seg(t,6.25,6.7)));}            // …and it's off again. loop.
  const press=t>=3.88&&t<4.3?0.95:1;
  set($('btn'),{transform:`translate(${bx} 702) scale(${press})`});
  // ---- guide, loupe, annoyance, burst, cursor
  const gIn=io(seg(t,1.4,1.8)), gOut=io(seg(t,2.35,2.6)), gF=t>=4.3&&t<5.4?1-io(seg(t,4.9,5.4)):0;
  set($('guide'),{'stroke-dashoffset':(1-gIn)*530,opacity:Math.max(gIn*(1-gOut),gF),'stroke-width':t>=4.3?5+5*(1-out(seg(t,4.3,4.7))):5});
  const lin=io(seg(t,1.55,2.0)), lout=io(seg(t,2.3,2.65));
  const lx=lerp(1100,810,lin)+lerp(0,330,lout), ly=lerp(600,620,lin)-lerp(0,40,lout), LR=110;
  set($('loupeRing'),{points:P(reg(lx,ly,LR))}); set($('loupeClipPoly'),{points:P(reg(lx,ly,LR-4))});
  set($('loupeBg'),{x:lx-LR,y:ly-LR,width:2*LR,height:2*LR});
  set($('loupeHandle'),{d:`M${lx+LR*0.72} ${ly+LR*0.72} L${lx+LR*1.45} ${ly+LR*1.45}`});
  const zx=lx,zy=ly+22,k=6,gap=(bx+105-770)*k;
  set(zBtn,{points:P([[zx-240,zy-28],[zx+gap,zy-28],[zx+gap,zy+240],[zx-240,zy+240]])});
  set(zGuide,{x1:zx,y1:zy-160,x2:zx,y2:zy+160});
  set(zLine,{x1:zx-24,y1:zy-46,x2:zx+gap+24,y2:zy-46});
  set(zAL,{points:P([[zx,zy-46],[zx-13,zy-54],[zx-13,zy-38]])}); set(zAR,{points:P([[zx+gap,zy-46],[zx+gap+13,zy-54],[zx+gap+13,zy-38]])});
  set(zPill,{x:zx+gap/2-44,y:zy-104,width:88,height:40}); set(zTxt,{x:zx+gap/2,y:zy-72});
  set(zDim,{opacity:io(seg(t,1.95,2.15))}); set($('loupe'),{opacity:lin>0&&lout<1?1:0});
  const an=seg(t,2.7,3.3);
  annoyL.forEach((o,i)=>{const v=Math.sin(cl((an-i*0.06)*1.6)*Math.PI);const cx=772,cy=652,r0=26,r1=26+32*v;
    set(o.l,{x1:cx+Math.cos(o.a)*r0,y1:cy+Math.sin(o.a)*r0,x2:cx+Math.cos(o.a)*r1,y2:cy+Math.sin(o.a)*r1,opacity:v>0.02?1:0});});
  const b=seg(t,4.3,4.7);
  burstL.forEach(o=>{const cx=770,cy=702,r0=60+70*out(b),r1=r0+lerp(30,0,b);
    set(o.l,{x1:cx+Math.cos(o.a)*r0,y1:cy+Math.sin(o.a)*r0*0.7,x2:cx+Math.cos(o.a)*r1,y2:cy+Math.sin(o.a)*r1*0.7,opacity:b>0&&b<1?1:0});});
  const cIn=io(seg(t,3.5,3.88)), cOut=io(seg(t,4.5,5.0));
  let cx_=lerp(980,bx+40,cIn), cy_=lerp(980,712,cIn); cx_=lerp(cx_,1020,cOut); cy_=lerp(cy_,1020,cOut);
  if(t>=4.05&&t<4.5) cx_=bx+40;
  set($('cursor'),{transform:`translate(${cx_} ${cy_}) scale(${press<1?0.92:1})`,opacity:cIn>0&&cOut<1?1:0});
}
window.__render=render; window.__ready=true;
if(!location.search.includes('capture')){const t0=performance.now();(function loop(n){render((n-t0)/1000);requestAnimationFrame(loop);})(t0);}
}
</script></body></html>
