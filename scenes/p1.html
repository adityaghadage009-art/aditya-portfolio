<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Two pixels off</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
svg{width:100%;height:100%;display:block}
.sans{font-family:Manrope,system-ui,sans-serif}
.hand{font-family:Hand,Gelasio,serif}
</style></head><body>
<!-- 01 · Attention to detail: a button sits two pixels off; it gets selected, measured and nudged home -->
<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="500" cy="842" rx="300" ry="18" fill="#1d1714" opacity=".07"/>
  <!-- the card -->
  <g id="card">
    <rect x="200" y="230" width="600" height="560" rx="26" fill="#fffdf8" stroke="#1d1714" stroke-width="8"/>
    <rect x="200" y="230" width="600" height="92" rx="26" fill="#f3e7cf"/>
    <rect x="200" y="296" width="600" height="26" fill="#f3e7cf"/>
    <line x1="200" y1="322" x2="800" y2="322" stroke="#1d1714" stroke-width="6"/>
    <rect x="200" y="230" width="600" height="560" rx="26" fill="none" stroke="#1d1714" stroke-width="8"/>
    <circle cx="246" cy="276" r="10" fill="#f26b4f" stroke="#1d1714" stroke-width="4"/>
    <circle cx="280" cy="276" r="10" fill="#e3a21a" stroke="#1d1714" stroke-width="4"/>
    <circle cx="314" cy="276" r="10" fill="#6f6b34" stroke="#1d1714" stroke-width="4"/>
    <!-- illustration block -->
    <rect x="252" y="366" width="200" height="170" rx="16" fill="#e3a21a" stroke="#1d1714" stroke-width="6"/>
    <path d="M268 520 L330 448 L372 492 L404 462 L438 520 Z" fill="#6f6b34" stroke="#1d1714" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="410" cy="408" r="16" fill="#fffdf8" stroke="#1d1714" stroke-width="5"/>
    <!-- title + highlighter -->
    <rect id="hl" x="484" y="386" width="250" height="22" rx="4" fill="#e3a21a" opacity=".45"/>
    <rect x="490" y="372" width="230" height="22" rx="6" fill="#1d1714"/>
    <rect x="490" y="420" width="250" height="14" rx="5" fill="#cfc4b2"/>
    <rect x="490" y="448" width="210" height="14" rx="5" fill="#cfc4b2"/>
    <rect x="490" y="476" width="234" height="14" rx="5" fill="#cfc4b2"/>
    <rect x="252" y="572" width="496" height="14" rx="5" fill="#e6dccb"/>
    <rect x="252" y="602" width="420" height="14" rx="5" fill="#e6dccb"/>
    <!-- the layout guide every element should sit on -->
    <line id="guide" x1="252" y1="560" x2="252" y2="760" stroke="#f26b4f" stroke-width="3" stroke-dasharray="10 8" opacity="0"/>
    <!-- the button that is two pixels off -->
    <g id="btn">
      <rect x="252" y="660" width="220" height="74" rx="14" fill="#1d1714"/>
      <rect x="292" y="690" width="140" height="14" rx="6" fill="#e3a21a"/>
    </g>
  </g>
  <!-- measurement: the gap that shouldn't be there -->
  <g id="meas" opacity="0">
    <line id="mLine" x1="252" y1="770" x2="270" y2="770" stroke="#f26b4f" stroke-width="4"/>
    <g id="mPill"><rect x="-40" y="-22" width="80" height="44" rx="10" fill="#f26b4f"/><text x="0" y="9" text-anchor="middle" class="sans" font-weight="800" font-size="24" fill="#fff">2px</text></g>
  </g>
  <!-- design-tool selection -->
  <g id="sel" opacity="0">
    <rect id="selR" fill="none" stroke="#0d99ff" stroke-width="4"/>
    <rect class="h" width="16" height="16" fill="#fff" stroke="#0d99ff" stroke-width="4"/><rect class="h" width="16" height="16" fill="#fff" stroke="#0d99ff" stroke-width="4"/>
    <rect class="h" width="16" height="16" fill="#fff" stroke="#0d99ff" stroke-width="4"/><rect class="h" width="16" height="16" fill="#fff" stroke="#0d99ff" stroke-width="4"/>
  </g>
  <!-- verdict -->
  <g id="ok" opacity="0">
    <rect x="-108" y="-30" width="216" height="60" rx="30" fill="#fffdf8" stroke="#1d1714" stroke-width="6"/>
    <path d="M-76 0 l14 14 l26 -30" fill="none" stroke="#6f6b34" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="10" text-anchor="middle" class="hand" font-size="36" fill="#1d1714">aligned</text>
  </g>
  <!-- cursor -->
  <g id="cur"><path d="M0 0 L0 56 L15 43 L26 68 L38 62 L27 38 L46 38 Z" fill="#1d1714" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round"/></g>
</svg>
<script>
const $ = id => document.getElementById(id);
const cl = v => Math.max(0, Math.min(1, v)), io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3), back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const seg = (t, a, b) => cl((t - a) / (b - a));
const T = 8.2, OFF = 18;                       // the "two pixels", drawn large enough to see
const btn = $('btn'), cur = $('cur'), sel = $('sel'), selR = $('selR'), H = [...document.querySelectorAll('.h')];
const meas = $('meas'), mLine = $('mLine'), mPill = $('mPill'), guide = $('guide'), ok = $('ok'), hl = $('hl');
function frame(now) {
  const t = (now / 1000) % T;
  // the button drifts off, gets nudged home, then drifts again for the next loop
  const fix = io(seg(t, 3.0, 3.9)), relax = io(seg(t, 7.3, 8.1));
  const off = OFF * (1 - fix) + OFF * relax * (fix >= 1 ? 1 : 0);
  btn.setAttribute('transform', `translate(${off} 0)`);
  // cursor: glide in, click, drag, glide out
  const p1 = io(seg(t, .4, 1.6)), p3 = io(seg(t, 4.6, 5.6));
  const bx = 252 + off + 160, by = 712;
  let cx = 860 + (bx - 860) * p1, cy = 900 + (by - 900) * p1;
  cx += (900 - cx) * p3; cy += (880 - cy) * p3;
  const press = seg(t, 1.7, 1.85) - seg(t, 1.9, 2.05);
  cur.setAttribute('transform', `translate(${cx} ${cy}) scale(${1 - .12 * press})`);
  // selection box hugs the button
  const sIn = out(seg(t, 1.8, 2.1)), sOut = seg(t, 4.4, 4.8);
  sel.setAttribute('opacity', (sIn * (1 - sOut)).toFixed(3));
  const x = 252 + off - 8, y = 652, w = 236, h = 90;
  selR.setAttribute('x', x); selR.setAttribute('y', y); selR.setAttribute('width', w); selR.setAttribute('height', h);
  [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(([a, b], i) => { H[i].setAttribute('x', a - 8); H[i].setAttribute('y', b - 8); });
  // the guide + the measured gap
  const gIn = seg(t, 2.1, 2.4), gOut = seg(t, 4.4, 4.9);
  guide.setAttribute('opacity', (gIn * (1 - gOut)).toFixed(3));
  guide.setAttribute('stroke', fix > .98 ? '#6f6b34' : '#f26b4f');
  meas.setAttribute('opacity', (gIn * (1 - seg(t, 3.5, 3.8))).toFixed(3));
  mLine.setAttribute('x2', 252 + off);
  mPill.setAttribute('transform', `translate(${252 + off / 2 + 2} 812) scale(${.85 + .15 * back(seg(t, 2.2, 2.6))})`);
  // verdict
  const k = back(seg(t, 3.9, 4.3)), kOut = seg(t, 6.6, 7.0);
  ok.setAttribute('opacity', (seg(t, 3.9, 4.05) * (1 - kOut)).toFixed(3));
  ok.setAttribute('transform', `translate(660 176) scale(${.6 + .4 * k}) rotate(${-4 + 4 * k})`);
  // the title gets its highlighter once it's right
  const hs = out(seg(t, 4.2, 4.9)) * (1 - seg(t, 7.0, 7.6));
  hl.setAttribute('width', (250 * hs).toFixed(1));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
