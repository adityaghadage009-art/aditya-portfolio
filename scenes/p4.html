<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Human judgement, AI speed</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
svg{width:100%;height:100%;display:block}
.sans{font-family:Manrope,system-ui,sans-serif}
.hand{font-family:Hand,Gelasio,serif}
</style></head><body>
<!-- 04 · Human judgement, AI speed: AI deals nine ideas in a blink; a human pen picks the one worth building -->
<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- prompt bar -->
  <g id="bar"><rect x="210" y="120" width="580" height="74" rx="37" fill="#fffdf8" stroke="#1d1714" stroke-width="6"/>
    <path d="M262 157 l9 -22 l9 22 l22 9 l-22 9 l-9 22 l-9 -22 l-22 -9 Z" fill="#e3a21a" stroke="#1d1714" stroke-width="4" stroke-linejoin="round"/>
    <rect id="typed" x="318" y="150" width="0" height="14" rx="6" fill="#1d1714"/>
    <circle cx="746" cy="157" r="22" fill="#1d1714"/><path d="M738 157 h16 m-7 -7 l7 7 l-7 7" stroke="#fffdf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="grid"></g>
  <path id="ring" fill="none" stroke="#e3a21a" stroke-width="9" stroke-linecap="round"/>
  <g id="pick" opacity="0"><rect x="-84" y="-26" width="168" height="52" rx="26" fill="#e3a21a" stroke="#1d1714" stroke-width="5"/>
    <text x="0" y="10" text-anchor="middle" class="hand" font-size="32" fill="#1d1714">this one.</text></g>
  <g id="lab" opacity="0"><text x="500" y="935" text-anchor="middle" class="sans" font-size="22" font-weight="800" letter-spacing="3" fill="#8b8177"><tspan id="labA">AI: 9 IDEAS IN SECONDS</tspan></text></g>
  <g id="pen"><path d="M0 0 l14 -40 l60 -96 l22 14 l-60 96 Z" fill="#f26b4f" stroke="#1d1714" stroke-width="5" stroke-linejoin="round"/><path d="M0 0 l14 -40 l22 14 Z" fill="#fffdf8" stroke="#1d1714" stroke-width="5" stroke-linejoin="round"/><path d="M0 0 l5 -14 l8 5 Z" fill="#1d1714"/></g>
</svg>
<script>
const $ = id => document.getElementById(id);
const cl = v => Math.max(0, Math.min(1, v)), io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3), back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const seg = (t, a, b) => cl((t - a) / (b - a));
const NS = 'http://www.w3.org/2000/svg', T = 10.4, PICK = 4;
const TINTS = ['#f7e7b4', '#e2e7cc', '#f5d9cb', '#dfe9e4', '#f3e7cf', '#e6e0f0', '#f7e7b4', '#f5d9cb', '#e2e7cc'];
const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); (p || $('grid')).appendChild(e); return e; };
// nine quick ideas: same skeleton, slightly different each time
const cards = TINTS.map((c, i) => { const g = mk('g', {}); const col = i % 3, row = (i / 3) | 0;
  mk('rect', { x: -80, y: -110, width: 160, height: 220, rx: 14, fill: '#fffdf8', stroke: '#1d1714', 'stroke-width': 5 }, g);
  mk('rect', { x: -64, y: -94, width: 128, height: 88, rx: 8, fill: c, stroke: '#1d1714', 'stroke-width': 3 }, g);
  mk('rect', { x: -64, y: 10, width: 70 + (i * 17 % 50), height: 12, rx: 5, fill: '#1d1714' }, g);
  mk('rect', { x: -64, y: 34, width: 120, height: 9, rx: 4, fill: '#cfc4b2' }, g);
  mk('rect', { x: -64, y: 74, width: 128, height: 22, rx: 8, fill: i === PICK ? '#1d1714' : '#cfc4b2' }, g);
  const x1 = mk('path', { d: 'M-50 -60 L50 60 M50 -60 L-50 60', stroke: '#f26b4f', 'stroke-width': 9, 'stroke-linecap': 'round', fill: 'none', 'stroke-dasharray': 340, 'stroke-dashoffset': 340 }, g);
  return { g, x: 300 + col * 200, y: 340 + row * 232, x1 }; });
function frame(now) {
  const t = (now / 1000) % T, reset = seg(t, 9.6, 10.3);
  $('typed').setAttribute('width', (380 * out(seg(t, .2, 1.0)) * (1 - reset)).toFixed(1));
  // AI: dealt fast, a little careless
  cards.forEach((c, i) => { const a = 1.1 + i * .09, k = back(seg(t, a, a + .35)), o = seg(t, a, a + .1) * (1 - reset);
    const chosen = i === PICK, lift = chosen ? io(seg(t, 7.0, 7.9)) : 0, dim = chosen ? 0 : seg(t, 7.0, 7.6);
    const sc = (.55 + .45 * k) * (1 + .55 * lift), x = c.x + (500 - c.x) * lift, y = c.y + (560 - c.y) * lift;
    c.g.setAttribute('opacity', (o * (1 - .82 * dim)).toFixed(3));
    c.g.setAttribute('transform', `translate(${x} ${y}) scale(${sc}) rotate(${(1 - k) * (i % 2 ? 8 : -8)})`);
    if (chosen) $('grid').appendChild(c.g); });
  // human: slow, deliberate strikes, then a circle around the one
  const order = [0, 2, 6, 8, 1, 3, 5, 7];
  order.forEach((i, j) => { const a = 3.0 + j * .32; cards[i].x1.setAttribute('stroke-dashoffset', (340 * (1 - io(seg(t, a, a + .28)) * (1 - reset))).toFixed(1)); });
  const rc = out(seg(t, 5.8, 6.6)) * (1 - seg(t, 6.9, 7.2)), c = cards[PICK];
  const pts = []; for (let k = 0; k <= 48 * rc; k++) { const an = -1.9 + k / 48 * Math.PI * 2.15; pts.push(`${(c.x + Math.cos(an) * 118).toFixed(1)} ${(c.y + Math.sin(an) * 150).toFixed(1)}`); }
  $('ring').setAttribute('d', pts.length > 1 ? 'M' + pts.join(' L') : '');
  // the pen follows the work
  let px = 880, py = 900;
  if (t > 2.6 && t < 5.8) { const j = Math.min(7, Math.floor((t - 3.0) / .32)), q = cards[order[Math.max(0, j)]], f = seg(t, 3.0 + j * .32, 3.28 + j * .32);
    px = q.x - 50 + 100 * f; py = q.y - 60 + 120 * f; if (t < 3.0) { const e = io(seg(t, 2.6, 3.0)); px = 880 + (cards[0].x - 50 - 880) * e; py = 900 + (cards[0].y - 60 - 900) * e; } }
  else if (t >= 5.8 && t < 6.9) { const an = -1.9 + rc * Math.PI * 2.15; px = c.x + Math.cos(an) * 118; py = c.y + Math.sin(an) * 150; }
  else if (t >= 6.9) { const e = io(seg(t, 6.9, 7.6)); const sx = c.x + Math.cos(-1.9 + Math.PI * 2.15) * 118, sy = c.y + Math.sin(-1.9 + Math.PI * 2.15) * 150; px = sx + (880 - sx) * e; py = sy + (900 - sy) * e; }
  $('pen').setAttribute('transform', `translate(${px} ${py})`);
  const pk = back(seg(t, 7.8, 8.2));
  $('pick').setAttribute('opacity', (seg(t, 7.8, 7.9) * (1 - reset)).toFixed(3));
  $('pick').setAttribute('transform', `translate(690 390) rotate(-6) scale(${.6 + .4 * pk})`);
  // caption swaps from the machine's speed to the human's call
  $('lab').setAttribute('opacity', (seg(t, 1.3, 1.6) * (1 - seg(t, 2.6, 2.9)) + seg(t, 7.9, 8.2) * (1 - reset)).toFixed(3));
  $('labA').textContent = t < 5 ? 'AI: 9 IDEAS IN SECONDS' : 'ME: THE ONE WORTH BUILDING';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
