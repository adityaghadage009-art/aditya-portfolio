<!DOCTYPE html>

<style>

<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="jarClip"><path d="M357 172 L357 236 Q357 252 373 252 L427 252 Q443 252 443 236 L443 172 Z"/></clipPath>
  <clipPath id="slotClip"><rect x="250" y="-200" width="300" height="364"/></clipPath>

<g transform="translate(-20 134) scale(1.3)"><g id="cam">
  <g id="paperG">
    <rect x="118" y="80" width="580" height="470" rx="8" fill="#1d1714" opacity=".1"/>

</svg>
<script>
{
const LOOP=10;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const set=(e,a)=>{for(const k in a)e.setAttribute(k,a[k]);};
const T=(p,x,y,s,size,fill,anchor='start',w=800)=>{const e=mk('text',{x,y,'font-size':size,fill,'text-anchor':anchor,'font-weight':w},p);e.textContent=s;return e;};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,p)=>a+(b-a)*p;
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, out=x=>1-Math.pow(1-x,3), inn=x=>x*x*x;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const spring=x=>x<=0?0:x>=1?1:1-Math.exp(-6*x)*Math.cos(9*x)*(1-x)-0*x;
const INK='#1d1714',CREAM='#fff8ec',MUS='#e3a21a',OLI='#6f6b34',COR='#f26b4f',TEAL='#2f8f83',PEACH='#ffeed2';
// paper
for(let y=110;y<540;y+=22) mk('line',{x1:122,y1:y,x2:678,y2:y},$('rules'));
for(let i=0;i<14;i++) mk('circle',{cx:140+i*40,cy:72,r:8,fill:'none',stroke:INK,'stroke-width':3.5},$('rings'));
// side sketches (static pencil ideas)
const side=[
 'M140 152 Q200 149 262 153 L260 296 Q200 299 141 297 Z','M172 196 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0','M200 188 h46 M200 204 h34','M156 236 h88 M156 254 h70 M156 272 h80',
 'M140 322 Q200 319 262 323 L261 440 Q200 443 140 441 Z','M158 352 h60 M158 372 h40','M214 404 q0 -12 12 -12 h12 q12 0 12 12 q0 12 -12 12 h-12 q-12 0 -12 -12','M238 404 m-8 0 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0',
 'M538 152 Q600 149 662 153 L661 284 Q600 287 539 285 Z','M588 214 c0 -16 22 -16 22 0 c0 -16 22 -16 22 0 c0 16 -22 26 -22 34 c0 -8 -22 -18 -22 -34','M570 190 l-8 -8 M650 190 l8 -8 M566 236 l-10 4','M560 266 h80',
 'M538 310 Q600 307 662 311 L661 440 Q600 443 539 441 Z','M556 420 L556 380 M578 420 L578 360 M600 420 L600 392 M622 420 L622 350 M644 420 L644 372','M552 424 h100','M556 334 h50',
 'M300 470 q30 -10 60 0 q30 10 60 0','M470 470 l14 -6 l-4 14'
];
side.forEach(d=>mk('path',{d},$('side')));
// main sketch (drawn by the pencil)
const SK=[
 'M300 131 Q400 127 504 132 Q511 133 511 141 L509 423 Q509 431 501 431 L299 430 Q290 430 290 421 L291 141 Q292 131 304 131',
 'M362 172 L362 159 L438 159 L438 172 L358 172','M357 174 L357 236 Q357 252 373 252 L427 252 Q443 252 443 236 L443 174',
 'M400 225 C384 212 386 196 400 205 C414 196 416 212 400 225','M372 242 q12 -6 24 0 M404 242 q12 -6 24 0',
 'M308 281 L440 281','M308 298 L410 298','M308 310 L492 310 L492 318 L308 318 L308 311',
 'M320 329 L350 329 Q362 329 362 341 Q362 353 350 353 L320 353 Q308 353 308 341 Q308 329 321 329',
 'M385 329 L415 329 Q427 329 427 341 Q427 353 415 353 L385 353 Q373 353 373 341 Q373 329 386 329',
 'M450 329 L480 329 Q492 329 492 341 Q492 353 480 353 L450 353 Q438 353 438 341 Q438 329 451 329',
 'M326 367 L474 367 Q492 367 492 385 Q492 403 474 403 L326 403 Q308 403 308 385 Q308 367 327 367'
].map(d=>{const p=mk('path',{d},$('sketch'));const L=p.getTotalLength();set(p,{'stroke-dasharray':L+' '+(L+10),'stroke-dashoffset':L});return {p,L};});
const DRAW0=0.2,DRAW1=1.85,GAP=0.035; const totL=SK.reduce((s,o)=>s+o.L,0); {let tt=DRAW0;const avail=DRAW1-DRAW0-GAP*(SK.length-1);SK.forEach(o=>{o.t0=tt;o.t1=tt+avail*o.L/totL;tt=o.t1+GAP;});}
// pencil / pen (tip at 0,0)
const pencil=mk('g',{},$('pencil'));
mk('g',{transform:'rotate(32)'},pencil).innerHTML=`<rect x="-8" y="-150" width="16" height="118" fill="${MUS}" stroke="${INK}" stroke-width="3.5"/><rect x="-8" y="-150" width="5" height="118" fill="#f5c14e"/><rect x="-8" y="-162" width="16" height="14" fill="#f5b8a6" stroke="${INK}" stroke-width="3.5"/><rect x="-8" y="-150" width="16" height="7" fill="#cfc4b2" stroke="${INK}" stroke-width="3"/><path d="M-8 -32 L0 0 L8 -32Z" fill="#f2d3a8" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M-2.6 -10 L0 0 L2.6 -10Z" fill="${INK}"/>`;
const pen=mk('g',{},$('pen'));
mk('g',{transform:'rotate(28)'},pen).innerHTML=`<rect x="-9" y="-150" width="18" height="96" rx="7" fill="${INK}"/><rect x="-9" y="-62" width="18" height="34" fill="#2d2622" stroke="${INK}" stroke-width="3"/><rect x="-3" y="-140" width="4" height="70" rx="2" fill="#4a403a"/><rect x="5" y="-146" width="5" height="44" rx="2" fill="${MUS}"/><path d="M-8 -30 L0 0 L8 -30Z" fill="#d8c08a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M0 -26 L0 -6" stroke="${INK}" stroke-width="2"/>`;
// the real UI card
const card=$('card');
mk('rect',{x:290,y:130,width:220,height:300,rx:20,fill:'#fff'},card);
mk('path',{d:'M290 150 Q290 130 310 130 L490 130 Q510 130 510 150 L510 262 L290 262 Z',fill:PEACH},card);
const glow=mk('circle',{cx:400,cy:205,r:62,fill:'#ffe0a8',opacity:.8},card);
// jar
const jar=mk('g',{},card);
mk('path',{d:'M357 172 L357 236 Q357 252 373 252 L427 252 Q443 252 443 236 L443 172 Z',fill:'#f3e7cf'},jar);
const fillG=mk('g',{'clip-path':'url(#jarClip)'},jar);
const fillR=mk('g',{},fillG);
mk('rect',{x:350,y:0,width:100,height:120,fill:'#ffd98a'},fillR);
[[368,2],[388,-1],[410,3],[430,0],[378,10],[402,12],[424,9]].forEach(([x,y])=>mk('ellipse',{cx:x,cy:y,rx:11,ry:4.5,fill:MUS,stroke:INK,'stroke-width':2.2},fillR));
mk('path',{d:'M365 186 L365 232',stroke:'#fff','stroke-width':6,'stroke-linecap':'round',opacity:.9},jar);
const jheart=mk('path',{d:'M400 225 C384 212 386 196 400 205 C414 196 416 212 400 225Z',fill:COR,stroke:INK,'stroke-width':3,'stroke-linejoin':'round'},jar);
mk('path',{d:'M357 172 L357 236 Q357 252 373 252 L427 252 Q443 252 443 236 L443 172',fill:'none',stroke:INK,'stroke-width':3.5,'stroke-linejoin':'round'},jar);
mk('rect',{x:360,y:158,width:80,height:16,rx:5,fill:TEAL,stroke:INK,'stroke-width':3.5},jar);
mk('rect',{x:385,y:163.5,width:30,height:5,rx:2.5,fill:INK},jar);
// text
T(card,308,283,'Meals for 50 kids',15.5,INK,'start',800);
const raised=T(card,308,300,'₹31,000 of ₹50,000 raised',10.5,OLI,'start',700);
mk('rect',{x:308,y:309,width:184,height:8,rx:4,fill:'#efe9df'},card);
const barG=mk('g',{'clip-path':'url(#barClip)'},card); const bar=mk('rect',{x:308,y:309,width:184,height:8,rx:4,fill:TEAL},barG);
const chips=['₹100','₹500','₹1k'].map((s,i)=>{const g=mk('g',{},card);const cx=335+i*65;const r=mk('rect',{x:cx-27,y:329,width:54,height:24,rx:12,fill:'#fff',stroke:INK,'stroke-width':2.5},g);T(g,cx,345.5,s,11,INK,'middle',800);return {g,r,cx};});
const btn=mk('g',{},card);
mk('rect',{x:308,y:370,width:184,height:36,rx:18,fill:INK},btn);
const btnFace=mk('g',{},btn);
mk('rect',{x:308,y:367,width:184,height:36,rx:18,fill:COR,stroke:INK,'stroke-width':2.8},btnFace);
const lbl1=T(btnFace,392,390,'Donate ₹100',13,'#fff','middle',800), lbl2=T(btnFace,392,390,'Donate ₹500',13,'#fff','middle',800);
mk('path',{d:'M446 385 c0 -6 7 -6 7 -1 c0 -5 7 -5 7 1 c0 5 -7 9 -7 11 c0 -2 -7 -6 -7 -11Z',fill:'#fff'},btnFace);
const ripple=mk('circle',{cx:400,cy:385,r:0,fill:'none',stroke:'#fff','stroke-width':3,opacity:0},btnFace);
mk('rect',{x:290,y:130,width:220,height:300,rx:20,fill:'none',stroke:INK,'stroke-width':3.5},card);
// coins (fly into slot)
const coins=[0,1,2].map(i=>{const outer=mk('g',{'clip-path':'url(#slotClip)'},$('coins'));const g=mk('g',{},outer);
  mk('circle',{r:13,fill:MUS,stroke:INK,'stroke-width':2.6},g);mk('circle',{r:8,fill:'none',stroke:'#b9790a','stroke-width':1.6},g);T(g,0,4.5,'₹',12,INK,'middle',900);return g;});
// hearts
const HP='M0 6 C-12 -4 -10 -16 0 -9 C10 -16 12 -4 0 6Z';
const hearts=[[-78,-70,1,-18,COR],[70,-86,.8,16,MUS],[96,-20,.7,24,COR],[-100,-6,.6,-12,TEAL],[0,-112,.9,0,COR],[-40,-120,.55,10,MUS]].map(([dx,dy,s,r,c])=>({g:mk('path',{d:HP,fill:c,stroke:INK,'stroke-width':2.4,'stroke-linejoin':'round'},$('hearts')),dx,dy,s,r}));
// hand (fingertip at 0,0)
const hand=mk('g',{},$('hand'));
hand.innerHTML=`<path d="M-7 8 Q-7 0 0 0 Q7 0 7 8 L7 30 Q16 26 20 33 Q29 29 33 37 Q44 35 44 47 L41 74 Q39 88 25 88 L4 88 Q-6 88 -12 80 L-33 56 Q-39 48 -33 43 Q-26 38 -19 45 L-7 56 Z" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M7 30 L7 44 M20 33 L20 45 M33 37 L33 47" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><path d="M2 88 L2 100 L36 100 L36 88" fill="${TEAL}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
// sparkles
const SP='M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5Z';
const sparks=[[262,140,1,MUS,6.7],[548,214,.75,TEAL,6.85],[266,388,.65,COR,7.0],[540,420,.9,MUS,7.15]].map(([x,y,s,c,t0])=>({g:mk('path',{d:SP,fill:c,stroke:INK,'stroke-width':2.4,'stroke-linejoin':'round'},$('sparks')),x,y,s,t0}));
// toast
const toast=mk('g',{},$('toast'));
toast.innerHTML=`<rect x="-126" y="6" width="252" height="58" rx="16" fill="${INK}" opacity=".18"/><rect x="-126" y="0" width="252" height="58" rx="16" fill="${INK}"/><circle cx="-96" cy="29" r="15" fill="${TEAL}"/><path d="M-103 29 l5 5 l10 -11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
T(toast,-72,25,'You just fed 5 kids!',13.5,CREAM,'start',800); T(toast,-72,44,'Thank you, Ananya',11,'#cfc6b6','start',700);
mk('path',{d:'M31 39 c0 -5 6 -5 6 -1 c0 -4 6 -4 6 1 c0 4 -6 8 -6 9 c0 -1 -6 -5 -6 -9Z',fill:MUS},toast);

const CX=400,CY=280; // lift pivot
const fmt=n=>'₹'+n.toLocaleString('en-IN');
function render(T0){
  const t=((T0%LOOP)+LOOP)%LOOP;
  // ---- 1. pencil sketch ----
  let px=760,py=560,pin=seg(t,0,DRAW0),pout=seg(t,DRAW1,DRAW1+0.3);
  const S={trim:[],coins:[],hearts:[],sparks:[]};
  SK.forEach((o,i)=>{const p=t>9.52?0:seg(t,o.t0,o.t1);S.trim.push(io(p));set(o.p,{'stroke-dashoffset':o.L*(1-io(p)*0.999-0.001*p)});});
  let cur=null;
  for(let i=0;i<SK.length;i++){const o=SK[i];
    if(t>=o.t0&&t<=o.t1){const q=o.p.getPointAtLength(o.L*io(seg(t,o.t0,o.t1)));cur=[q.x,q.y];break;}
    if(i<SK.length-1&&t>o.t1&&t<SK[i+1].t0){const a=o.p.getPointAtLength(o.L),b=SK[i+1].p.getPointAtLength(0),k=io(seg(t,o.t1,SK[i+1].t0));cur=[lerp(a.x,b.x,k),lerp(a.y,b.y,k)-Math.sin(k*Math.PI)*10];break;}}
  if(t<DRAW0){const b=SK[0].p.getPointAtLength(0),k=out(pin);cur=[lerp(760,b.x,k),lerp(600,b.y,k)];}
  if(t>DRAW1){const a=SK[SK.length-1].p.getPointAtLength(SK[SK.length-1].L),k=io(pout);cur=[lerp(a.x,780,k),lerp(a.y,620,k)];}
  const pencilVis=t<DRAW1+0.3;
  set(pencil,{transform:`translate(${cur[0]} ${cur[1]}) rotate(${Math.sin(t*9)*2})`,opacity:pencilVis?1:0});S.pencil=[cur[0],cur[1],pencilVis?Math.sin(t*9)*2:0,pencilVis?1:0];
  // ---- 2. pen inks the card ----
  const sw=t>9.58?0:seg(t,2.25,3.25), edge=lerp(286,514,io(sw));
  set($('inkRect'),{width:Math.max(0,edge-280)+(t>3.3&&t<9.58?400:0),x:t>3.3&&t<9.58?100:280,height:t>3.3&&t<9.58?600:360,y:t>3.3&&t<9.58?0:100});
  set($('skRect'),{x:edge,width:540-edge});
  const tri=x=>{const f=x%1;return f<.5?f*2:2-f*2;};
  let ex=edge,ey=lerp(138,424,tri(sw*3.5));
  const penIn=out(seg(t,2.0,2.25)),penOut=io(seg(t,3.25,3.55));
  if(t<2.25){ex=lerp(720,286,penIn);ey=lerp(40,138,penIn);} if(t>3.25){ex=lerp(514,760,penOut);ey=lerp(ey,40,penOut);}
  set(pen,{transform:`translate(${ex} ${ey})`,opacity:t>1.98&&t<3.56?1:0});S.pen=[ex,ey,t>1.98&&t<3.56?1:0];S.edge=edge;S.inkEdge=sw>0&&sw<1?0.9:0;
  set($('inkEdge'),{x1:edge,x2:edge,opacity:sw>0&&sw<1?0.9:0});
  // ---- 3. lift ----
  const lu=seg(t,3.5,4.15), ld=io(seg(t,8.8,9.5));
  const L=back(lu)*(1-ld);
  const s=1+0.09*L, dy=-8*L, rot=-1.5*Math.sin(Math.PI*lu)*(1-ld);
  set($('lift'),{transform:`translate(${CX} ${CY+dy}) rotate(${rot}) scale(${s}) translate(${-CX} ${-CY})`});
  set($('shadow'),{opacity:0.24*cl(L),transform:`translate(0 ${16*cl(L)})`});
  const Z=1+0.38*io(seg(t,3.5,4.3))*(1-io(seg(t,8.8,9.6)));
  set($('cam'),{transform:`translate(${CX} ${CY}) scale(${Z}) translate(${-CX} ${-CY})`});S.cam=Z;
  set($('paperG'),{opacity:1-0.5*cl(L),transform:`translate(400 300) scale(${1-0.03*cl(L)}) translate(-400 -300)`});
  const cw=t>9.64?1:1-io(seg(t,8.9,9.5));set($('cardWrap'),{opacity:cw});S.card=cw;S.lift=[dy,rot,s];S.shadow=[0.24*cl(L),16*cl(L)];S.paper=[1-0.5*cl(L),1-0.03*cl(L)];
  // ---- 4. tap chip, tap button ----
  const tapChip=4.75, tapBtn=5.4;
  let hx,hy;
  const h1=io(seg(t,4.05,4.7)), h2=io(seg(t,4.9,5.32)), h3=io(seg(t,5.65,6.15));
  hx=lerp(620,402,h1);hy=lerp(520,344,h1);
  if(t>4.9){hx=lerp(402,404,h2);hy=lerp(344,388,h2)-Math.sin(h2*Math.PI)*16;}
  if(t>5.65){hx=lerp(404,640,h3);hy=lerp(388,540,h3);}
  const press=t=>{const a=seg(t,-0.08,0),b=seg(t,0,0.18);return t<0?out(a):1-out(b);};
  const pc=Math.max(press(t-tapChip)*(t>tapChip-0.1&&t<tapChip+0.2?1:0),press(t-tapBtn)*(t>tapBtn-0.1&&t<tapBtn+0.2?1:0));
  set(hand,{transform:`translate(${hx} ${hy}) scale(${1-0.1*pc}) rotate(${-8+4*pc})`,opacity:t>4.0&&t<6.15?1:0});S.hand=[hx,hy,1-0.1*pc,t>4.0&&t<6.15?1:0];
  // chips
  const cs=seg(t,tapChip,tapChip+0.12), reset=t>9.5||t<tapChip;
  chips.forEach((c,i)=>{let on=i===0?1-cs:i===1?cs:0; if(reset)on=i===0?1:0;
    const pop=i===1&&t>tapChip?1+0.14*Math.exp(-7*(t-tapChip))*Math.sin(18*(t-tapChip)):1;
    set(c.r,{fill:on>0.5?MUS:'#fff'});S['sel'+i]=on>0.5?1:0;if(i===1)S.pop=pop; set(c.g,{transform:`translate(${c.cx} 341) scale(${pop}) translate(${-c.cx} -341)`});});
  const lx=io(seg(t,tapChip+0.05,tapChip+0.3)); const lr=t>9.5?0:lx;
  S.lbl=lr;set(lbl1,{opacity:1-lr,transform:`translate(0 ${-8*lr})`}); set(lbl2,{opacity:lr,transform:`translate(0 ${8*(1-lr)})`});
  // button press
  const bp=t>tapBtn-0.08&&t<tapBtn+0.4?(t<tapBtn?out(seg(t,tapBtn-0.08,tapBtn)):1-back(seg(t,tapBtn,tapBtn+0.4))):0;
  set(btnFace,{transform:`translate(0 ${3*bp})`});S.btn=3*bp;
  const rp=seg(t,tapBtn,tapBtn+0.6); set(ripple,{r:8+90*out(rp),opacity:rp>0&&rp<1?0.7*(1-rp):0});S.ripple=[(8+90*out(rp))/98,rp>0&&rp<1?0.7*(1-rp):0];
  // ---- 5. coins into the jar ----
  const levels=[0.18,0.38,0.57,0.76]; let lvl=levels[0];
  coins.forEach((g,i)=>{const t0=tapBtn+0.05+i*0.17,f=seg(t,t0,t0+0.62);
    const sx=400+[-26,30,-8][i], peak=[96,84,108][i];
    let x,y; if(f<0.62){const k=out(f/0.62);x=lerp(400,sx,k);y=lerp(378,peak,k);} else {const k=inn((f-0.62)/0.38);x=lerp(sx,400,io((f-0.62)/0.38));y=lerp(peak,176,k);}
    const flip=f<0.85?Math.cos(f*Math.PI*5):lerp(Math.cos(0.85*Math.PI*5),0.18,seg(f,0.85,1));
    set(g,{transform:`translate(${x} ${y}) scale(${Math.abs(flip)<0.15?0.15:flip} 1) rotate(${f*90})`,opacity:f>0&&f<1?1:0});S.coins.push([x,y,Math.max(0.15,Math.abs(flip)),f*90,f>0&&f<1?1:0]);
    const land=t0+0.62; if(t>land) lvl=lerp(levels[i],levels[i+1],out(seg(t,land,land+0.3)));
  });
  if(t>9.5||t<tapBtn) lvl=levels[0];
  set(fillR,{transform:`translate(0 ${252-80*lvl})`});S.lvl=lvl;
  let squash=0; [0,1,2].forEach(i=>{const land=tapBtn+0.05+i*0.17+0.62,d=t-land; if(d>0&&d<0.5)squash+=Math.exp(-8*d)*Math.sin(d*30)*0.05;});
  set(jar,{transform:`translate(400 252) scale(${1+squash} ${1-squash}) translate(-400 -252)`});S.squash=squash;
  // ---- 6. progress + counter ----
