<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Designing for delight</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
svg{width:100%;height:100%;display:block}
.sans{font-family:Manrope,system-ui,sans-serif}
.hand{font-family:Hand,Gelasio,serif}
</style></head><body>
<!-- 03 · Designing for delight: the same tap, once plain, once with a little joy -->
<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="500" cy="880" rx="220" ry="16" fill="#1d1714" opacity=".07"/>
  <!-- phone -->
  <rect x="320" y="150" width="360" height="700" rx="48" fill="#1d1714"/>
  <rect x="340" y="172" width="320" height="656" rx="32" fill="#fffdf8"/>
  <rect x="452" y="186" width="96" height="18" rx="9" fill="#1d1714"/>
  <!-- content -->
  <rect x="372" y="240" width="256" height="210" rx="20" fill="#f3e7cf" stroke="#1d1714" stroke-width="6"/>
  <!-- the doodle that draws itself in the delightful version -->
  <g id="sun" fill="none" stroke="#1d1714" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle id="sunC" cx="500" cy="345" r="52" fill="#e3a21a" stroke-dasharray="330" stroke-dashoffset="330"/>
    <path id="smile" d="M476 356 Q500 380 524 356" stroke-dasharray="60" stroke-dashoffset="60"/>
    <path id="eyes" d="M482 330 v6 M518 330 v6" stroke-dasharray="14" stroke-dashoffset="14"/>
    <g id="rays" stroke-dasharray="26" stroke-dashoffset="26"><path d="M500 268 v-18"/><path d="M500 422 v18"/><path d="M423 345 h-18"/><path d="M577 345 h18"/><path d="M446 291 l-13 -13"/><path d="M554 291 l13 -13"/><path d="M446 399 l-13 13"/><path d="M554 399 l13 13"/></g>
  </g>
  <rect x="372" y="480" width="200" height="22" rx="6" fill="#1d1714"/>
  <rect x="372" y="516" width="256" height="12" rx="5" fill="#cfc4b2"/>
  <rect x="372" y="540" width="214" height="12" rx="5" fill="#cfc4b2"/>
  <!-- message line that changes tone -->
  <text id="msgA" x="500" y="618" text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#8b8177">Submitted.</text>
  <text id="msgB" x="500" y="622" text-anchor="middle" class="hand" font-size="34" fill="#1d1714" opacity="0">Made someone's day!</text>
  <!-- button -->
  <g id="btn"><rect id="btnR" x="372" y="676" width="256" height="82" rx="18" fill="#1d1714"/>
    <rect id="btnL" x="452" y="710" width="96" height="14" rx="6" fill="#e3a21a"/>
    <path id="heart" d="M500 740 C470 718 470 694 486 692 C494 691 500 698 500 704 C500 698 506 691 514 692 C530 694 530 718 500 740 Z" fill="#f26b4f" stroke="#fffdf8" stroke-width="4" opacity="0"/></g>
  <g id="conf"></g>
  <!-- version tag -->
  <g id="tag"><rect x="-86" y="-26" width="172" height="52" rx="26" fill="#fffdf8" stroke="#1d1714" stroke-width="5"/>
    <text id="tagT" x="0" y="9" text-anchor="middle" class="sans" font-size="22" font-weight="800" fill="#1d1714" letter-spacing="2">WORKS</text></g>
  <g id="cur"><path d="M0 0 L0 56 L15 43 L26 68 L38 62 L27 38 L46 38 Z" fill="#1d1714" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round"/></g>
</svg>
<script>
const $ = id => document.getElementById(id);
const cl = v => Math.max(0, Math.min(1, v)), io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3), back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const seg = (t, a, b) => cl((t - a) / (b - a));
const T = 9.6, NS = 'http://www.w3.org/2000/svg', COLS = ['#e3a21a', '#f26b4f', '#6f6b34', '#fffdf8', '#e3a21a', '#1d1714'];
// confetti: simple flat shapes with an ink outline, like the rest of the site
const bits = Array.from({ length: 26 }, (_, i) => { const e = document.createElementNS(NS, i % 3 ? 'rect' : 'circle');
  if (i % 3) { e.setAttribute('width', 16); e.setAttribute('height', 10); e.setAttribute('x', -8); e.setAttribute('y', -5); e.setAttribute('rx', 2); } else e.setAttribute('r', 7);
  e.setAttribute('fill', COLS[i % COLS.length]); e.setAttribute('stroke', '#1d1714'); e.setAttribute('stroke-width', 3);
  $('conf').appendChild(e); const a = -Math.PI / 2 + (i / 25 - .5) * 2.6; return { e, a, v: 200 + (i * 53 % 7) * 26, s: (i * 37 % 11) - 5 }; });
function frame(now) {
  const t = (now / 1000) % T;
  const second = t >= 4.6;                       // first half: plain; second half: delightful
  const lt = second ? t - 4.6 : t;               // local time within each half (0 → 5)
  // cursor glides to the button and taps
  const pin = io(seg(lt, .2, 1.1)), pout = io(seg(lt, 2.6, 3.6));
  let cx = 760 - 210 * pin, cy = 900 - 170 * pin; cx += 200 * pout; cy += 160 * pout;
  const press = seg(lt, 1.2, 1.32) - seg(lt, 1.4, 1.6);
  $('cur').setAttribute('transform', `translate(${cx} ${cy}) scale(${1 - .12 * press})`);
  // button squash: flat in the first half, springy in the second
  const sq = second ? press * .14 - Math.sin(seg(lt, 1.4, 2.2) * Math.PI * 3) * .05 * (1 - seg(lt, 1.4, 2.2)) : press * .04;
  $('btn').setAttribute('transform', `translate(500 717) scale(${1 + sq * .6} ${1 - sq}) translate(-500 -717)`);
  const tapped = seg(lt, 1.35, 1.5);
  $('msgA').setAttribute('opacity', (second ? 0 : tapped * (1 - seg(lt, 4.2, 4.6))).toFixed(3));
  $('msgB').setAttribute('opacity', (second ? tapped * (1 - seg(lt, 4.4, 5.0)) : 0).toFixed(3));
  $('btnL').setAttribute('opacity', second && tapped > .5 && lt < 4.4 ? 0 : 1);
  const hk = back(seg(lt, 1.4, 1.9));
  $('heart').setAttribute('opacity', second && lt < 4.4 ? tapped : 0);
  $('heart').setAttribute('transform', `translate(500 716) scale(${.4 + .6 * hk}) translate(-500 -716)`);
  // the doodle draws itself, then the confetti falls
  const draw = second ? out(seg(lt, 1.5, 2.6)) * (1 - seg(lt, 4.3, 5.0)) : 0;
  $('sunC').setAttribute('stroke-dashoffset', 330 * (1 - draw)); $('sunC').setAttribute('fill-opacity', seg(lt, 2.2, 2.6) * (1 - seg(lt, 4.3, 5.0)) * (second ? 1 : 0));
  $('smile').setAttribute('stroke-dashoffset', 60 * (1 - (second ? out(seg(lt, 2.4, 2.8)) * (1 - seg(lt, 4.3, 5.0)) : 0)));
  $('eyes').setAttribute('stroke-dashoffset', 14 * (1 - (second ? seg(lt, 2.3, 2.5) * (1 - seg(lt, 4.3, 5.0)) : 0)));
  $('rays').setAttribute('stroke-dashoffset', 26 * (1 - (second ? out(seg(lt, 2.6, 3.0)) * (1 - seg(lt, 4.3, 5.0)) : 0)));
  $('rays').setAttribute('transform', `rotate(${second ? lt * 12 : 0} 500 345)`);
  const ct = second ? lt - 1.45 : -1;
  bits.forEach(b => { if (ct < 0 || ct > 2.4) { b.e.setAttribute('opacity', 0); return; }
    const x = 500 + Math.cos(b.a) * b.v * ct, y = 700 + Math.sin(b.a) * b.v * ct + 520 * ct * ct;
    b.e.setAttribute('opacity', (1 - seg(ct, 1.7, 2.4)).toFixed(3)); b.e.setAttribute('transform', `translate(${x} ${y}) rotate(${b.s * ct * 90})`); });
  // tag: "works" vs "works + delights"
  $('tagT').textContent = second ? 'DELIGHTS' : 'WORKS';
  const tk = back(seg(lt, 1.6, 2.0)), to = seg(lt, 1.6, 1.7) * (1 - seg(lt, 4.2, 4.6));
  $('tag').setAttribute('opacity', to.toFixed(3));
  $('tag').setAttribute('transform', `translate(${second ? 770 : 230} 214) rotate(${second ? 6 : -6}) scale(${.6 + .4 * tk})`);
  $('tag').querySelector('rect').setAttribute('fill', second ? '#e3a21a' : '#fffdf8');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
