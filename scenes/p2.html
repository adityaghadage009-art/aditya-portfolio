<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Asking why</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
svg{width:100%;height:100%;display:block}
.sans{font-family:Manrope,system-ui,sans-serif}
.hand{font-family:Hand,Gelasio,serif}
</style></head><body>
<!-- 02 · Empathy first: someone gives up on a form; three "why?" notes later, one clearer label gets them through -->
<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="380" cy="850" rx="250" ry="16" fill="#1d1714" opacity=".07"/>
  <!-- the form -->
  <g id="form">
    <rect x="150" y="300" width="460" height="520" rx="24" fill="#fffdf8" stroke="#1d1714" stroke-width="8"/>
    <rect x="196" y="346" width="180" height="22" rx="6" fill="#1d1714"/>
    <rect x="196" y="384" width="290" height="12" rx="5" fill="#cfc4b2"/>
    <!-- progress -->
    <rect x="196" y="424" width="368" height="16" rx="8" fill="#ece3d4"/>
    <rect id="prog" x="196" y="424" width="220" height="16" rx="8" fill="#6f6b34"/>
    <!-- field 1 (fine) -->
    <rect x="196" y="476" width="110" height="12" rx="5" fill="#8b8177"/>
    <rect x="196" y="498" width="368" height="56" rx="12" fill="#fffdf8" stroke="#1d1714" stroke-width="5"/>
    <rect x="216" y="520" width="150" height="12" rx="5" fill="#1d1714"/>
    <!-- field 2 (the confusing label) -->
    <g id="lblA"><rect x="196" y="584" width="86" height="12" rx="5" fill="#8b8177"/><text x="294" y="598" class="sans" font-size="22" font-weight="800" fill="#f26b4f">Ref. ID?</text></g>
    <g id="lblB" opacity="0"><text x="196" y="598" class="sans" font-size="22" font-weight="800" fill="#6f6b34">Booking number</text></g>
    <rect id="f2" x="196" y="610" width="368" height="56" rx="12" fill="#fffdf8" stroke="#f26b4f" stroke-width="5"/>
    <rect id="f2txt" x="216" y="632" width="0" height="12" rx="5" fill="#1d1714"/>
    <line id="caret" x1="222" y1="624" x2="222" y2="652" stroke="#1d1714" stroke-width="4"/>
    <!-- submit -->
    <rect id="sub" x="196" y="708" width="368" height="64" rx="14" fill="#cfc4b2"/>
    <rect x="320" y="734" width="120" height="12" rx="5" fill="#fffdf8"/>
  </g>
  <!-- the person, drawn like the hero -->
  <g id="who" transform="translate(110 210)">
    <circle cx="0" cy="0" r="62" fill="#f3c9a1" stroke="#1d1714" stroke-width="7"/>
    <path d="M-62 -6 C-64 -60 -20 -78 10 -72 C50 -66 70 -38 62 -6 C44 -30 20 -38 -6 -34 C-30 -30 -48 -22 -62 -6 Z" fill="#1d1714"/>
    <circle cx="-20" cy="6" r="6" fill="#1d1714"/><circle cx="22" cy="6" r="6" fill="#1d1714"/>
    <path id="mouth" fill="none" stroke="#1d1714" stroke-width="6" stroke-linecap="round"/>
    <path id="brow" fill="none" stroke="#1d1714" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- speech: giving up -->
  <g id="bub" opacity="0">
    <path d="M200 92 h240 a22 22 0 0 1 22 22 v58 a22 22 0 0 1 -22 22 h-196 l-30 26 l4 -26 h-18 a22 22 0 0 1 -22 -22 v-58 a22 22 0 0 1 22 -22 Z" fill="#fffdf8" stroke="#1d1714" stroke-width="6"/>
    <text x="320" y="156" text-anchor="middle" class="hand" font-size="40" fill="#1d1714">I give up…</text>
  </g>
  <!-- three whys, pinned on the right -->
  <g id="n1" opacity="0"><rect x="-130" y="-70" width="260" height="140" rx="4" fill="#f7e7b4" stroke="#1d1714" stroke-width="4"/><circle cx="0" cy="-60" r="11" fill="#f26b4f" stroke="#1d1714" stroke-width="4"/>
    <text x="-98" y="-14" class="sans" font-size="18" font-weight="800" fill="#8b8177" letter-spacing="2">WHY?</text><text x="-98" y="30" class="hand" font-size="29" fill="#1d1714">They left here</text></g>
  <g id="n2" opacity="0"><rect x="-130" y="-70" width="260" height="140" rx="4" fill="#e2e7cc" stroke="#1d1714" stroke-width="4"/><circle cx="0" cy="-60" r="11" fill="#f26b4f" stroke="#1d1714" stroke-width="4"/>
    <text x="-98" y="-14" class="sans" font-size="18" font-weight="800" fill="#8b8177" letter-spacing="2">WHY?</text><text x="-98" y="30" class="hand" font-size="29" fill="#1d1714">"Ref. ID" ?!</text></g>
  <g id="n3" opacity="0"><rect x="-130" y="-70" width="260" height="140" rx="4" fill="#e3a21a" stroke="#1d1714" stroke-width="4"/><circle cx="0" cy="-60" r="11" fill="#1d1714"/>
    <text x="-98" y="-14" class="sans" font-size="18" font-weight="800" fill="#1d1714" letter-spacing="2">REAL PROBLEM</text><text x="-98" y="30" class="hand" font-size="29" fill="#1d1714">One unclear label</text></g>
  <path id="link" d="M610 625 C 660 625 660 640 700 640" fill="none" stroke="#1d1714" stroke-width="4" stroke-dasharray="8 8" opacity="0"/>
  <g id="done" opacity="0"><circle r="40" fill="#6f6b34" stroke="#1d1714" stroke-width="6"/><path d="M-16 0 l11 12 l22 -26" fill="none" stroke="#fffdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
<script>
const $ = id => document.getElementById(id);
const cl = v => Math.max(0, Math.min(1, v)), io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3), back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const seg = (t, a, b) => cl((t - a) / (b - a));
const T = 10;
const N = [[$('n1'), 780, 250, -4, 1.6], [$('n2'), 790, 430, 3, 2.6], [$('n3'), 780, 620, -2, 3.6]];
function frame(now) {
  const t = (now / 1000) % T, reset = seg(t, 9.2, 9.9);
  // caret blinks while they hesitate in the confusing field
  const fixed = seg(t, 4.8, 5.4);
  $('caret').setAttribute('opacity', fixed > 0 && reset < 1 ? 0 : (Math.floor(t * 2.4) % 2 ? 1 : 0));
  // giving up
  const giveUp = seg(t, .6, .9) * (1 - seg(t, 2.2, 2.6));
  $('bub').setAttribute('opacity', giveUp.toFixed(3));
  $('bub').setAttribute('transform', `translate(0 ${(1 - out(seg(t, .6, 1))) * 14})`);
  // the notes, one why at a time
  N.forEach(([g, x, y, r, a]) => { const k = back(seg(t, a, a + .5)), o = seg(t, a, a + .2) * (1 - reset);
    g.setAttribute('opacity', o.toFixed(3)); g.setAttribute('transform', `translate(${x} ${y - (1 - k) * 40}) rotate(${r + (1 - k) * 8}) scale(${.9 + .1 * k})`); });
  $('link').setAttribute('opacity', (seg(t, 4.2, 4.5) * (1 - reset)).toFixed(3));
  $('link').setAttribute('stroke-dashoffset', -t * 40);
  // the fix: label rewritten, field calms, they finish
  $('lblA').setAttribute('opacity', (1 - fixed * (1 - reset)).toFixed(3));
  $('lblB').setAttribute('opacity', (fixed * (1 - reset)).toFixed(3));
  $('f2').setAttribute('stroke', fixed > .5 && reset < .5 ? '#1d1714' : '#f26b4f');
  const typed = out(seg(t, 5.6, 6.6)) * (1 - reset);
  $('f2txt').setAttribute('width', (200 * typed).toFixed(1));
  const p = 220 + 148 * io(seg(t, 6.6, 7.4)) * (1 - reset);
  $('prog').setAttribute('width', p.toFixed(1));
  $('sub').setAttribute('fill', seg(t, 7.3, 7.4) > 0 && reset < .5 ? '#1d1714' : '#cfc4b2');
  const d = back(seg(t, 7.5, 8.0));
  $('done').setAttribute('opacity', (seg(t, 7.5, 7.6) * (1 - reset)).toFixed(3));
  $('done').setAttribute('transform', `translate(560 300) scale(${.5 + .5 * d})`);
  // their face follows the story
  const happy = seg(t, 7.0, 7.6) * (1 - reset), sad = seg(t, .3, .8) * (1 - happy);
  const m = 22 - 34 * sad + 0 * happy, curve = -14 * sad + 18 * happy;
  $('mouth').setAttribute('d', `M-22 30 Q0 ${30 + curve} 22 30`);
  $('brow').setAttribute('d', `M-34 ${-14 - 6 * sad} L-8 ${-12 + 4 * sad} M8 ${-12 + 4 * sad} L34 ${-14 - 6 * sad}`);
  $('who').setAttribute('transform', `translate(110 210) rotate(${-6 * sad + 4 * happy * Math.sin(t * 6)})`);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
